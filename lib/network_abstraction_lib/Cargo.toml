[package]
name = "network_abstraction_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tonic = { version = "0.14.6", optional = true }
prost = { version = "0.14.4", optional = true }
tonic-prost = { version = "0.14.6", optional = true }
prost-types = { version = "0.14.4", optional = true }
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.33"
erased-serde = "0.4.10"
serde_flexitos = "0.2.2"
typed_request_macros = { path = "./typed_request_macros" }
inventory = "0.3"


[build-dependencies]
tonic-prost-build = { version = "0.14.6", optional = true }


[features]
default = []
grpc = [
    "tonic",
    "prost",
    "tonic-prost-build",
    "tonic-prost",
    "prost-types"
]
