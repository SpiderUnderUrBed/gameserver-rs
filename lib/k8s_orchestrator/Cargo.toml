[package]
name = "k8s_orchestrator"
version = "0.1.0"
edition = "2024"

[dependencies]
walkdir = { version = "2.5.0"}
k8s-openapi = { version = "0.24.0", features = ["v1_28"] }
bollard = { version = "0.19.0-rc1" }
kube = { version = "0.99.0" }
serde_yaml = { version = "0.9.34" }
tar = { version = "0.4" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
http-body-util = "0.1.3"
http-body = "1.0.1"
futures-util = "0.3"