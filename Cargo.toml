
[package]
name = "gameserver-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
kube = { version = "0.99.0", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1.3"
http-body = "1.0.1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
anyhow = "1.0.97"
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
httpc-test = { version = "0.1.10", features = ["colored", "colored_json"] }
serde = { version = "1.0.219", features = ["serde_derive", "derive"] }
serde_json = "1.0.140"
tower-http = { version = "0.6.2", features = ["add-extension", "cors", "fs"] }
mime_guess = "2.0.5"
jsonwebtoken = "9.3.1"
bcrypt = "0.17.0"
chrono = "0.4.41"
axum-login = "0.17.0"
async-trait = "0.1.88"
sqlx = { version = "0.8.6", optional = true, features = ["postgres", "runtime-tokio", "runtime-tokio-native-tls"] }
urlencoding = "2.1.3"
serial_test = "3.2.0"
serde_urlencoded = "0.7.1"
sysinfo = "0.37.0"
env = "1.0.1"
rcon = { version = "0.6.0", features = ["rt-tokio"] }
bytes = "1.11.0"
tower-sessions = "0.14.0"
axum-oidc = { git = "https://github.com/pfzetto/axum-oidc" }
tower = "0.5.3"
base64 = "0.22.1"
general_networked_filesystem = { path = "lib/general_networked_filesystem" }
k8s_orchestrator = { path = "lib/k8s_orchestrator", optional = true  }
multer = "3.1.0"
tonic = { version = "0.14.6", optional = true }
prost = { version = "0.14.4", optional = true }
tonic-prost = { version = "0.14.6", optional = true }
prost-types = { version = "0.14.4", optional = true }
flume = "0.12.0"
tokio-stream = "0.1.19"

[build-dependencies]
tonic-prost-build = { version = "0.14.6", optional = true }

[features]
default = []
database = [
    "sqlx"
]
docker = [
    "sqlx"
]
full-stack = [
    "kube",
    "serde_yaml",
    "sqlx",
    "k8s_orchestrator"
]
grpc_experimental = [
    "tonic",
    "prost",
    "tonic-prost",
    "tonic-prost-build",
    "prost-types"
]

[workspace]
members = [
    "gameserver"
, "k8s_orchestrator_node", "lib/general_networked_filesystem", "lib/k8s_orchestrator"]

[[bin]]
name = "gameserver-rs"
path = "src/main.rs"

