syntax = "proto3";

import "google/protobuf/struct.proto";

package main;

message MetadataTypes {
  string kind = 1;
  string data = 2;
}
message ApiCalls {
  string kind = 1;
  string data = 2;
}
message SrcAndDest {
  ApiCalls src = 1;
  ApiCalls dest = 2;
  string metadata = 3;
}
message MessagePayload {
  string type = 1;
  string message = 2;
  string authcode = 3;
}

message DeleteServerRequest {
  MetadataTypes metadata = 1;
}

message CreateServerRequest {
  MetadataTypes metadata = 1;
}

message StartServerRequest {}

message StopServerRequest {}

message ServerMessage {
  string authcode = 1;
  string data = 2;
  string type = 3;
}

message SetServerRequest {
  string message = 1;
  string type = 2;
  MetadataTypes metadata = 3;
  string authcode = 4;
}

message MigrateRequest {
  ApiCalls src = 1;
  ApiCalls dest = 2;
  string metadata = 3;
}
message ServerDataRequest {}

message ServerStateRequest {}

message ServerNameRequest {
  string type = 1;
  string message = 2;
  string authcode = 3;
}

message RawBytes {
  bytes byte_collection = 1;
}
message Ping {} 
message IntegrationKeyRequest {
  google.protobuf.Struct key = 1;
}

message State {
  string name = 1;
  string start_keyword = 2;
  string stop_keyword = 3;
}
message ServerDataResponse {
  State state = 1;
}
message PingResponse {
  string message = 1;
}
message FileOperationResponse {
  string data = 1;
}
message CreateServerResponse {}
message DeleteServerResponse {}
message ServerStateResponse {
  MessagePayload message = 1; 
}
message ServerNameResponse {
  string type = 1;
  string message = 2;
  string authcode = 3;
}
message SetServerResponse {}
message StartServerResponse {}
message StopServerResponse {}

message DownloadRequest {
  string location = 1;
}
message UploadResponse {}
message FileChunk {
  string location = 1;
  bytes bytes = 2;
}
message RawFileChunk {
  bytes bytes = 2;
}
message LsRequest {
  string location = 1;
}
message FileItem {
  string name = 1;
  bool is_dir = 2;
}
message LsResponse {
  repeated FileItem file_item = 1;
}
message CanonicalizeRequest {
  string path = 1;
}
message CanonicalizeResponse {
  string full_path = 1;
}
message SizeRequest {
  string location = 1;
}
message SizeResponse {
  uint64 size = 1;
}

service ServerEdit {
  rpc Create(CreateServerRequest) returns (stream ServerMessage);
  rpc Delete(DeleteServerRequest) returns (DeleteServerResponse);
  rpc Start(stream ServerMessage) returns (stream ServerMessage);
  rpc Stop(StopServerRequest) returns (StopServerResponse);
}
service ServerManage {
  rpc Data(ServerDataRequest) returns (ServerDataResponse);
  rpc State(ServerStateRequest) returns (ServerStateResponse);
  rpc Set(SetServerRequest) returns (SetServerResponse);
}
service NodeManage {
  rpc Name(ServerNameRequest) returns (ServerNameResponse);
}

service General {

}
service FilesystemManage {
  rpc Download(DownloadRequest) returns (stream RawFileChunk);
  rpc Upload(stream FileChunk) returns (UploadResponse);
  rpc Ls(LsRequest) returns (LsResponse);
  rpc Canonicalize(CanonicalizeRequest) returns (CanonicalizeResponse);
  rpc Size(SizeRequest) returns (SizeResponse);
}